name: Scheduled

# Everything that runs on a clock rather than on a change. Each cron selects its
# own jobs; the rest skip. Failures of the nightly and soak jobs open or update
# one tracking issue instead of one notification per job.
#
#   every 15 min      synthetic probes against staging (nester#1056)
#   daily  03:00 UTC  contracts property tests and fuzzing, API property tests,
#                     testnet deposit/withdraw journey
#   weekly 02:00 Sun  staging load soak
#
# The testnet journey needs a funded account, and the soak and probes need a
# staging target; each skips itself with a notice when that is not configured:
#   TESTNET_WALLET_ADDRESS (secret), VAULT_ID (variable), STAGING_URL (variable)
#   STAGING_LOAD_* and STAGING_PROBE_* (secrets), see docs/ci/secrets.md.

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 3 * * *"
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "Which scheduled task to run"
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - soak
          - probes
      staging_url:
        description: "nightly: base URL for the testnet journey (overrides the STAGING_URL variable)"
        required: false
        type: string
      allow_mutations:
        description: >-
          probes: run the deposit and withdrawal probes, which create real
          staging transactions. Leave false for a read-only run.
        type: boolean
        default: false

# One run per task at a time. Keyed on the cron (or the dispatched task) so a
# 45-minute nightly never holds up the 15-minute probes. Never cancelled: two
# concurrent deposit probes against the same vault would interleave and produce
# failures that describe the probes rather than the service.
concurrency:
  group: scheduled-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contracts-property:
    name: Contracts property tests
    if: github.event.schedule == '0 3 * * *' || inputs.task == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          rust: "true"

      # Deliberately omit PROPTEST_RNG_SEED: each nightly run explores a new set
      # of sequences, while ci.yml supplies the reproducible merge gate.
      - name: Run randomized share-accounting properties
        env:
          PROPTEST_CASES: "256"
        run: cargo test -p nester-integration-tests property_tests -- --nocapture

  contracts-fuzz:
    name: Fuzz vault conversion arithmetic
    if: github.event.schedule == '0 3 * * *' || inputs.task == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts/contracts/vault/fuzz
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # cargo-fuzz's sanitizer and coverage instrumentation need nightly's
      # unstable -Zsanitizer flags; the rest of the contracts workspace builds on
      # stable, so this is scoped to this one job.
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-toolchain: nightly
          rust-workspace: packages/contracts/contracts/vault/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # 600s matches the 20-minute timeout with headroom for toolchain and
      # instrumented-build time, which dominates the wall clock.
      - name: Fuzz conversion_math
        run: cargo fuzz run conversion_math -- -max_total_time=600

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vault-conversion-fuzz-artifacts
          path: packages/contracts/contracts/vault/fuzz/artifacts/conversion_math/
          retention-days: 30

  api-property:
    name: API property tests
    if: github.event.schedule == '0 3 * * *' || inputs.task == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          go: "true"

      # Deliberately omit RAPID_SEED: each nightly run explores a new set of
      # sequences, while ci.yml supplies the reproducible merge gate.
      - name: Run randomized share-accounting properties
        env:
          RAPID_CHECKS: "256"
        run: go test -timeout 120s -run PropertyBased -v ./internal/domain/vault

  e2e-testnet:
    name: Testnet deposit / withdraw journey
    if: github.event.schedule == '0 3 * * *' || inputs.task == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/dapp/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/setup
        with:
          node: "true"
          install: "false"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Only needed when driving a locally served build. With STAGING_URL set
      # the workflow tests the deployed app instead and this is wasted work.
      - name: Build dapp
        if: ${{ !inputs.staging_url && !vars.STAGING_URL }}
        run: pnpm build

      - name: Start dapp
        if: ${{ !inputs.staging_url && !vars.STAGING_URL }}
        run: |
          pnpm start -p 3001 &
          npx wait-on http://localhost:3001 --timeout 120000

      - name: Run deposit/withdraw journey
        env:
          TESTNET_WALLET_ADDRESS: ${{ secrets.TESTNET_WALLET_ADDRESS }}
          VAULT_ID: ${{ vars.VAULT_ID }}
          STAGING_URL: ${{ inputs.staging_url || vars.STAGING_URL }}
          CI: "true"
        run: |
          # Skip rather than fail: a hard failure means a red build every night
          # until someone provisions testnet credentials, which trains people to
          # ignore the notification. A notice is visible in the run summary
          # without being a false alarm, and matches the spec's own skip guard.
          if [ -z "$TESTNET_WALLET_ADDRESS" ]; then
            echo "::notice::TESTNET_WALLET_ADDRESS is not configured; skipping the testnet E2E run."
            echo "Set it under Settings → Secrets and variables → Actions. See docs/ci/secrets.md."
            exit 0
          fi

          pnpm test:e2e:testnet

      # On failure only: the trace and screenshots identify which step of the
      # journey broke.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/dapp/frontend/playwright-report
            apps/dapp/frontend/test-results
          retention-days: 14

  soak:
    name: k6 soak (staging)
    if: github.event.schedule == '0 2 * * 0' || inputs.task == 'soak'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The checked-out workspace is mounted into the k6 container; do not
          # leave the default GITHUB_TOKEN in .git/config for test code to read.
          persist-credentials: false

      # A missing secret must never cause a test to fall back to localhost or
      # production. The `secrets` context is not available in a job-level `if`,
      # so the guard lives in a step: every later step keys off its output.
      - name: Check staging target is configured
        id: guard
        env:
          API_BASE_URL: ${{ secrets.STAGING_LOAD_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_LOAD_API_BASE_URL is not set — skipping the soak run."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run isolated staging soak
        if: steps.guard.outputs.configured == 'true'
        env:
          API_BASE_URL: ${{ secrets.STAGING_LOAD_API_BASE_URL }}
          WS_URL: ${{ secrets.STAGING_LOAD_WS_URL }}
          VAULT_ID: ${{ secrets.STAGING_LOAD_VAULT_ID }}
          AUTH_TOKEN: ${{ secrets.STAGING_LOAD_AUTH_TOKEN }}
        run: |
          mkdir -p results
          docker run --rm --network host \
            -e API_BASE_URL -e WS_URL -e VAULT_ID -e AUTH_TOKEN \
            -v "$PWD:/work" -w /work grafana/k6:latest \
            run --summary-export results/soak-summary.json tests/load/soak.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: k6-soak-summary-${{ github.run_id }}
          path: results/soak-summary.json
          if-no-files-found: warn

  # Synthetic probes (nester#1056). Real-traffic SLIs cannot see a flow that is
  # broken while nobody is using it, so these exercise deposit, withdrawal and
  # balance read on a schedule. Every 15 minutes rather than every 5: the
  # mutating probes create real testnet transactions, and the
  # SyntheticProbeStale alert allows 30 minutes, tolerating one missed run.
  # Not wired into the report job: probe failures alert through the pushed
  # metrics, and a tracking-issue comment every 15 minutes would be noise.
  probe:
    name: Probe staging
    if: github.event.schedule == '*/15 * * * *' || inputs.task == 'probes'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # A missing secret must never let a probe fall back to localhost or to
      # production. probe.py refuses to guess a target on its own; this guard
      # keeps the run from being reported as a failure when it is simply not
      # configured yet. Same pattern as the soak job above.
      - name: Check staging target is configured
        id: guard
        env:
          API_BASE_URL: ${{ secrets.STAGING_PROBE_API_BASE_URL }}
          AUTH_TOKEN: ${{ secrets.STAGING_PROBE_AUTH_TOKEN }}
          VAULT_ID: ${{ secrets.STAGING_PROBE_VAULT_ID }}
        run: |
          all_set=true
          for var in API_BASE_URL AUTH_TOKEN VAULT_ID; do
            if [ -z "$(eval echo \$$var)" ]; then
              echo "::notice::STAGING_PROBE_${var} is not set — skipping the probe run."
              all_set=false
            fi
          done
          if [ "$all_set" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            # Surfaced in the job summary, not only as an annotation. The
            # guard requires all three secrets, so a partially-configured
            # environment disables every probe while the workflow still
            # reports green — the state most likely to be mistaken for
            # "probes are running and finding nothing".
            {
              echo "### Synthetic probes skipped"
              echo
              echo "Not all STAGING_PROBE_* secrets are configured, so no probe ran."
              echo "Monitoring is **not** active for this run. See docs/ci/secrets.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run synthetic probes
        id: probes
        if: steps.guard.outputs.configured == 'true'
        continue-on-error: true
        # continue-on-error allows the Pushgateway push (below) to happen even
        # if probes fail, so metrics are always published for alerting. The
        # actual build gate is the "Report probe failure" step that follows,
        # which exits 1 if this step failed. This ensures failures are visible
        # in both the Actions UI and through alerting metrics.
        env:
          PROBE_API_BASE_URL: ${{ secrets.STAGING_PROBE_API_BASE_URL }}
          PROBE_AUTH_TOKEN: ${{ secrets.STAGING_PROBE_AUTH_TOKEN }}
          PROBE_VAULT_ID: ${{ secrets.STAGING_PROBE_VAULT_ID }}
          PROBE_ENVIRONMENT: staging
          PROBE_AMOUNT: ${{ vars.STAGING_PROBE_AMOUNT || '0.01' }}
          # Mutating probes are opt-in. The scheduled run is read-only unless
          # STAGING_PROBE_ALLOW_MUTATIONS is set for this environment, so
          # enabling money movement is a deliberate configuration act rather
          # than a side effect of merging this workflow.
          PROBE_ALLOW_MUTATIONS: >-
            ${{ inputs.allow_mutations && 'true'
                || vars.STAGING_PROBE_ALLOW_MUTATIONS || 'false' }}
        run: |
          mkdir -p results
          python tests/probes/probe.py --output results/probes.prom

      # Pushed separately from the probe run, and only when a gateway is
      # configured. The probe's own exit code is not the signal here: a failed
      # probe still has results worth publishing, which is why the run step
      # uses continue-on-error and the alerting is driven by the metrics.
      - name: Push probe results
        if: steps.guard.outputs.configured == 'true'
        env:
          PUSHGATEWAY_URL: ${{ secrets.STAGING_PUSHGATEWAY_URL }}
          PUSHGATEWAY_AUTH: ${{ secrets.STAGING_PUSHGATEWAY_AUTH }}
        run: |
          set -euo pipefail
          # Checked here rather than in the step's `if`: a step's own `env`
          # block is not available to its condition, so the expression would
          # silently evaluate to empty and skip the push every time.
          if [ -z "${PUSHGATEWAY_URL:-}" ]; then
            echo "::notice::STAGING_PUSHGATEWAY_URL is not set — probe results not pushed."
            exit 0
          fi
          auth_args=()
          if [ -n "${PUSHGATEWAY_AUTH:-}" ]; then
            auth_args=(--header "Authorization: Bearer ${PUSHGATEWAY_AUTH}")
          fi
          curl -sSf --max-time 30 "${auth_args[@]}" \
            --data-binary @results/probes.prom \
            "${PUSHGATEWAY_URL%/}/metrics/job/nester_synthetic_probes/environment/staging"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.guard.outputs.configured == 'true'
        with:
          name: probe-results-${{ github.run_id }}
          path: results/probes.prom
          if-no-files-found: warn

      # The workflow fails after publishing, so a failed probe is visible in
      # the Actions UI as well as through alerting. Publishing first means a
      # failure never costs us the metrics that explain it.
      - name: Report probe failure
        if: steps.guard.outputs.configured == 'true' && steps.probes.outcome == 'failure'
        run: |
          echo "::error::One or more synthetic probes failed. See the run log and results/probes.prom."
          exit 1

  # Opens one tracking issue the first time a scheduled run fails and appends a
  # comment on every later failure, rather than one issue per failing night.
  report:
    name: Report failures
    needs: [contracts-property, contracts-fuzz, api-property, e2e-testnet, soak]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const failed = Object.entries(needs)
              .filter(([, job]) => job.result === 'failure')
              .map(([name]) => name);
            const title = 'Nightly run failing';
            const label = 'nightly-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Failed jobs: ${failed.map((n) => `\`${n}\``).join(', ')}\n\nRun: ${runUrl}`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const existing = open.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: [label],
              body: `The scheduled nightly workflow has failing jobs. Later failures are appended as comments; close this issue once the cause is fixed.\n\n${body}`,
            });
