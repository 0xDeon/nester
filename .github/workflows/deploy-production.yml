name: "Deploy to Production"

# Triggers on a release tag push ONLY. Unlike deploy-staging.yml (which also
# supports workflow_dispatch for ad-hoc deploys), production deploys always
# start from a tag -- the tag is the immutable, auditable record of exactly
# what got deployed, and resolving it to image digests below means the
# running containers are byte-for-byte what that tag's CI already built and
# tested, never a moving `:latest`.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  # One production deploy at a time. Unlike staging's
  # cancel-in-progress: false, a second tag pushed mid-deploy should not
  # queue behind a deploy that might be rolling back -- but we still never
  # cancel a deploy that is already past the approval gate, since cancelling
  # mid-migration or mid-rollout is its own hazard. In practice this just
  # means: don't push two release tags back to back without checking the
  # first one finished.
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/suncrestlabs/nester-api
  SIGNER_IMAGE: ghcr.io/suncrestlabs/nester-signer

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Resolve the release tag to immutable image digests.
  # ────────────────────────────────────────────────────────────────────
  # deploy-staging.yml builds from source on every deploy; production never
  # does. It only ever deploys an image CI already built and tagged with this
  # exact ref during the tag's own CI run (ci.yml's build steps tag images
  # with ${{ github.ref_name }} on a tag push -- see that workflow). This job
  # resolves that tag to its content digest so every later job, including the
  # rollback job, pins to the same immutable image.
  # ────────────────────────────────────────────────────────────────────
  resolve-digests:
    name: "Resolve image digests"
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.resolve.outputs.api_digest }}
      signer_digest: ${{ steps.resolve.outputs.signer_digest }}
      previous_api_digest: ${{ steps.previous.outputs.api_digest }}
      previous_signer_digest: ${{ steps.previous.outputs.signer_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag to digests
        id: resolve
        run: |
          set -euo pipefail
          API_DIGEST=$(docker buildx imagetools inspect "${{ env.API_IMAGE }}:${{ github.ref_name }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          SIGNER_DIGEST=$(docker buildx imagetools inspect "${{ env.SIGNER_IMAGE }}:${{ github.ref_name }}" --format '{{json .Manifest.Digest}}' | tr -d '"')

          if [ -z "$API_DIGEST" ] || [ -z "$SIGNER_DIGEST" ]; then
            echo "::error::Could not resolve ${{ github.ref_name }} to an image digest. Did ci.yml's tag build finish for this tag?"
            exit 1
          fi

          echo "api_digest=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "signer_digest=$SIGNER_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ github.ref_name }} -> api@$API_DIGEST, signer@$SIGNER_DIGEST"

      # The digest this release is replacing, recorded up front (not inside
      # the rollback job) so rollback never has to guess "previous" under
      # pressure after something has already gone wrong -- it just reads what
      # was captured here before this deploy touched anything.
      - name: Record currently-deployed digests for rollback
        id: previous
        env:
          KUBE_CONFIG: ${{ secrets.PRODUCTION_KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::PRODUCTION_KUBE_CONFIG is not configured. Required to read the currently-deployed digest before rolling forward."
            exit 1
          fi
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"

          CURRENT_API=$(kubectl get deployment nester-api-production -n nester-production -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
          CURRENT_SIGNER=$(kubectl get deployment nester-signer-production -n nester-production -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")

          echo "api_digest=${CURRENT_API#*@}" >> "$GITHUB_OUTPUT"
          echo "signer_digest=${CURRENT_SIGNER#*@}" >> "$GITHUB_OUTPUT"
          echo "Previously deployed: api@${CURRENT_API#*@}, signer@${CURRENT_SIGNER#*@}"
          rm -f "$RUNNER_TEMP/kubeconfig"

  # ────────────────────────────────────────────────────────────────────
  # Production approval gate. Everything from here on requires a reviewer
  # on the `production` GitHub Environment to approve the run.
  #
  # NOTE (disclosed, not configurable from this file): referencing
  # `environment: production` below only POINTS this job at the Environment;
  # it does not create or configure it. A maintainer with repo admin access
  # must create the `production` Environment in Settings -> Environments and
  # add required reviewers there -- that part cannot be done from a workflow
  # file. Until that's configured, this job runs without a human gate.
  # ────────────────────────────────────────────────────────────────────
  migrate:
    name: "Run production migrations"
    needs: resolve-digests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check required secrets
        env:
          KUBE_CONFIG: ${{ secrets.PRODUCTION_KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::PRODUCTION_KUBE_CONFIG is not configured. Settings -> Secrets and variables -> Actions -> PRODUCTION_KUBE_CONFIG."
            exit 1
          fi

      - name: Render migration job manifest
        env:
          API_DIGEST: ${{ needs.resolve-digests.outputs.api_digest }}
          SIGNER_DIGEST: ${{ needs.resolve-digests.outputs.signer_digest }}
        run: |
          set -euo pipefail
          python3 -c "
          import os
          content = open('deploy/production/k8s-production.yaml').read()
          content = content.replace('ghcr.io/suncrestlabs/nester-api@__API_IMAGE_DIGEST__', '${{ env.API_IMAGE }}@' + os.environ['API_DIGEST'])
          content = content.replace('ghcr.io/suncrestlabs/nester-signer@__SIGNER_IMAGE_DIGEST__', '${{ env.SIGNER_IMAGE }}@' + os.environ['SIGNER_DIGEST'])
          open('$RUNNER_TEMP/k8s-production.rendered.yaml', 'w').write(content)
          "

      - name: Run migration job
        env:
          KUBE_CONFIG: ${{ secrets.PRODUCTION_KUBE_CONFIG }}
        run: |
          set -euo pipefail
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"

          kubectl delete job nester-api-migrate -n nester-production --ignore-not-found
          kubectl apply -f <(python3 -c "
          import yaml, sys
          docs = list(yaml.safe_load_all(open('$RUNNER_TEMP/k8s-production.rendered.yaml')))
          for d in docs:
              if d.get('kind') == 'Job':
                  yaml.safe_dump(d, sys.stdout)
          ")

          echo "Waiting for the migration job's pod to log completion..."
          # See the KNOWN LIMITATION note in deploy/production/k8s-production.yaml:
          # the api binary keeps serving after migrating rather than exiting, so
          # completion is read from the log line main.go emits
          # ("database migrations complete"), not from the Job's pod phase.
          for _ in $(seq 1 30); do
            LOGS=$(kubectl logs job/nester-api-migrate -n nester-production 2>/dev/null || echo "")
            if echo "$LOGS" | grep -q "database migrations complete"; then
              echo "Migrations complete."
              kubectl delete job nester-api-migrate -n nester-production
              rm -f "$RUNNER_TEMP/kubeconfig"
              exit 0
            fi
            if echo "$LOGS" | grep -qi "auto-migrate:.*error\|panic:"; then
              echo "::error::Migration job logged an error:"
              echo "$LOGS"
              kubectl delete job nester-api-migrate -n nester-production --ignore-not-found
              rm -f "$RUNNER_TEMP/kubeconfig"
              exit 1
            fi
            sleep 5
          done

          echo "::error::Migration job did not log completion within the timeout."
          kubectl logs job/nester-api-migrate -n nester-production || true
          kubectl delete job nester-api-migrate -n nester-production --ignore-not-found
          rm -f "$RUNNER_TEMP/kubeconfig"
          exit 1

  # ────────────────────────────────────────────────────────────────────
  # Deploy API + signer at the pinned digests.
  # ────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to Production"
    needs: [resolve-digests, migrate]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deployed_api_digest: ${{ needs.resolve-digests.outputs.api_digest }}
      deployed_signer_digest: ${{ needs.resolve-digests.outputs.signer_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check required secrets
        env:
          KUBE_CONFIG: ${{ secrets.PRODUCTION_KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::PRODUCTION_KUBE_CONFIG is not configured. Settings -> Secrets and variables -> Actions -> PRODUCTION_KUBE_CONFIG."
            exit 1
          fi

      - name: Render and apply manifests
        env:
          KUBE_CONFIG: ${{ secrets.PRODUCTION_KUBE_CONFIG }}
          API_DIGEST: ${{ needs.resolve-digests.outputs.api_digest }}
          SIGNER_DIGEST: ${{ needs.resolve-digests.outputs.signer_digest }}
        run: |
          set -euo pipefail
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"

          python3 -c "
          import os
          content = open('deploy/production/k8s-production.yaml').read()
          content = content.replace('ghcr.io/suncrestlabs/nester-api@__API_IMAGE_DIGEST__', '${{ env.API_IMAGE }}@' + os.environ['API_DIGEST'])
          content = content.replace('ghcr.io/suncrestlabs/nester-signer@__SIGNER_IMAGE_DIGEST__', '${{ env.SIGNER_IMAGE }}@' + os.environ['SIGNER_DIGEST'])
          open('$RUNNER_TEMP/k8s-production.rendered.yaml', 'w').write(content)
          "

          # Apply everything except the one-shot Job, which `migrate` already
          # ran to completion and deleted -- re-applying it here would just
          # recreate a finished job.
          kubectl apply -f <(python3 -c "
          import yaml, sys
          docs = list(yaml.safe_load_all(open('$RUNNER_TEMP/k8s-production.rendered.yaml')))
          for d in docs:
              if d.get('kind') != 'Job':
                  yaml.safe_dump(d, sys.stdout)
                  print('---')
          ")

          kubectl rollout status deployment/nester-api-production -n nester-production --timeout=5m
          kubectl rollout status deployment/nester-signer-production -n nester-production --timeout=5m
          rm -f "$RUNNER_TEMP/kubeconfig"

      - name: Wait for API readiness
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.nester.app/api/v1' }}
        run: |
          READYZ_URL="${PRODUCTION_API_URL%/api/v1}/readyz"
          echo "Polling $READYZ_URL"

          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /tmp/readyz-body -w '%{http_code}' "$READYZ_URL" || echo "000")
            BODY=$(cat /tmp/readyz-body 2>/dev/null || echo "")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "API ready: $BODY"
              exit 0
            fi

            echo "Not ready yet ($i/30): HTTP $HTTP_CODE, $BODY"
            sleep 2
          done

          echo "::error::API did not become ready within the timeout. Last response: HTTP $HTTP_CODE, $BODY"
          exit 1

  # ────────────────────────────────────────────────────────────────────
  # Smoke checks against the live production deploy. Gating: a failure here
  # triggers the rollback job below.
  # ────────────────────────────────────────────────────────────────────
  smoke-test:
    name: "Production Smoke Checks"
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - uses: ./.github/actions/setup
        with:
          node: "true"

      - name: Install Playwright browsers
        run: pnpm --filter @nester/dapp exec playwright install chromium --with-deps

      - name: Run smoke tests against production
        id: smoke
        env:
          # Reuses the same tests/smoke.spec.ts suite deploy-staging.yml runs
          # (see that workflow's "Run smoke tests" step), pointed at
          # production instead. Nothing mainnet-specific is added here; the
          # suite is read-only health/flow checks, not a real-funds deposit --
          # a real mainnet deposit/withdraw canary is a separate concern
          # (nester#1390), not part of this deploy workflow.
          STAGING_URL: ${{ vars.PRODUCTION_URL || 'https://nester.app' }}
          SMOKE_TEST: "1"
          SMOKE_TEST_WALLET_SECRET: ${{ secrets.PRODUCTION_SMOKE_TEST_WALLET_SECRET }}
        run: |
          if [ -z "$SMOKE_TEST_WALLET_SECRET" ]; then
            echo "::error::PRODUCTION_SMOKE_TEST_WALLET_SECRET is not configured."
            exit 1
          fi

          cd apps/dapp/frontend
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=smoke-result.json \
          npx playwright test tests/smoke.spec.ts \
            --reporter="html,json,list"
          TEST_EXIT_CODE=$?
          set -e

          echo "test_exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $TEST_EXIT_CODE

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-smoke-test-results-${{ github.run_id }}
          path: |
            apps/dapp/frontend/playwright-report/
            apps/dapp/frontend/test-results/
            apps/dapp/frontend/smoke-result.json
          retention-days: 30

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1
        with:
          payload: |
            {
              "text": "Production Deployment Smoke Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Smoke Test Failure*\nTag: ${{ github.ref_name }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>\nRollback job should trigger next."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYMENT_WEBHOOK }}

  # ────────────────────────────────────────────────────────────────────
  # Automatic rollback to the digests captured by resolve-digests, before
  # this deploy touched anything. Runs only when smoke-test actually failed
  # (not when it was skipped or cancelled -- an automatic rollback on a
  # cancelled run would fight whoever cancelled it).
  # ────────────────────────────────────────────────────────────────────
  rollback:
    name: "Automatic Rollback"
    runs-on: ubuntu-latest
    needs: [resolve-digests, deploy, smoke-test]
    if: needs.smoke-test.result == 'failure'
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check we have something to roll back to
        env:
          PREV_API: ${{ needs.resolve-digests.outputs.previous_api_digest }}
        run: |
          if [ -z "$PREV_API" ]; then
            echo "::error::No previous digest was recorded (first-ever production deploy?). Automatic rollback has nothing to roll back to -- a maintainer must intervene manually."
            exit 1
          fi

      - name: Roll back API and signer to previous digests
        env:
          KUBE_CONFIG: ${{ secrets.PRODUCTION_KUBE_CONFIG }}
          PREV_API: ${{ needs.resolve-digests.outputs.previous_api_digest }}
          PREV_SIGNER: ${{ needs.resolve-digests.outputs.previous_signer_digest }}
        run: |
          set -euo pipefail
          echo "$KUBE_CONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"

          kubectl set image deployment/nester-api-production \
            api="${{ env.API_IMAGE }}@${PREV_API}" \
            -n nester-production
          kubectl set image deployment/nester-signer-production \
            signer="${{ env.SIGNER_IMAGE }}@${PREV_SIGNER}" \
            -n nester-production

          kubectl rollout status deployment/nester-api-production -n nester-production --timeout=5m
          kubectl rollout status deployment/nester-signer-production -n nester-production --timeout=5m
          rm -f "$RUNNER_TEMP/kubeconfig"

          echo "Rolled back to api@${PREV_API}, signer@${PREV_SIGNER}"

      - name: Notify Slack of rollback
        if: always()
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1
        with:
          payload: |
            {
              "text": "Production deploy of ${{ github.ref_name }} failed smoke checks and was automatically rolled back.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Automatic Rollback*\nTag ${{ github.ref_name }} failed smoke checks.\nRolled back to api@${{ needs.resolve-digests.outputs.previous_api_digest }}\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYMENT_WEBHOOK }}

      - name: Fail the workflow
        run: |
          echo "Rolled back automatically. The original deploy still counts as a failure -- investigate before re-tagging."
          exit 1
