# Mainnet launch contract set (#1501).
#
# The single source of truth for what ships on mainnet. Read by:
#   - scripts/deploy-mainnet.sh      refuses any package not listed here
#   - scripts/launch_manifest.py     size-gate checks each listed WASM against max_wasm_bytes
#   - docs/security/audit-scope.md   the audit scope is exactly this list
#
# audited_commit is the commit the auditors reviewed for that contract. An empty
# value means the contract is not yet cleared for mainnet and cannot be deployed.
# Anything not listed (lp_aggregator, referral, savings_goal, recurring_deposit,
# adapter_lending, adapter_pool, rent_escrow, ...) cannot be deployed with the
# mainnet script.
#
# max_wasm_bytes defaults to the Soroban 64 KiB contract size limit.

[[contract]]
package = "nester-access-control"
audited_commit = ""
max_wasm_bytes = 65536

